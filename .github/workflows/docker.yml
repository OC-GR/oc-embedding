name: CPU images

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and verify linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: oc-embedding-ci:${{ github.sha }}-${{ matrix.arch }}
      BUILDER: oc-embedding-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      CONTAINER: oc-embedding-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Generate a local model without downloading weights
        run: python3 scripts/ci/generate-model.py --output "$RUNNER_TEMP/ci-model"
      - name: Create an isolated native builder
        run: docker buildx create --name "$BUILDER" --driver docker-container --use --bootstrap
      - name: Build the production image
        run: |
          docker buildx build --builder "$BUILDER" \
            --platform "linux/${{ matrix.arch }}" \
            --file docker/Dockerfile.cpu --target production \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --provenance=false --sbom=false --load --tag "$IMAGE" .
      - name: Check metadata and run real offline HTTP inference
        run: |
          python3 scripts/ci/test-image.py \
            --image "$IMAGE" --model-dir "$RUNNER_TEMP/ci-model" \
            --container-name "$CONTAINER" \
            --expected-architecture "${{ matrix.arch }}" \
            --expected-version 0.0.77 --expected-revision "$GITHUB_SHA"
      - name: Delete test containers, image and builder
        if: always()
        run: |
          for oc_name in "$CONTAINER" "$CONTAINER-reference" "$CONTAINER-version"; do
            if docker container inspect "$oc_name" >/dev/null 2>&1; then
              docker container rm --force "$oc_name"
            fi
          done
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            docker image rm --force "$IMAGE"
          fi
          if docker buildx inspect "$BUILDER" >/dev/null 2>&1; then
            docker buildx rm --force "$BUILDER"
          fi
          for oc_name in "$CONTAINER" "$CONTAINER-reference" "$CONTAINER-version"; do
            if docker container inspect "$oc_name" >/dev/null 2>&1; then
              echo "Test container remains: $oc_name" >&2
              exit 1
            fi
          done
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Test image remains: $IMAGE" >&2
            exit 1
          fi
          if docker buildx inspect "$BUILDER" >/dev/null 2>&1; then
            echo "Test builder remains: $BUILDER" >&2
            exit 1
          fi
