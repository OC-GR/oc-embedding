name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      POETRY_NO_INTERACTION: '1'
      INFINITY_ANONYMOUS_USAGE_STATS: '0'
    defaults:
      run:
        shell: bash
        working-directory: libs/infinity_emb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate the upstream dependency lock
        run: |
          python -m pip install poetry==1.8.4
          poetry check
          poetry lock --check
      - name: Install the locked CPU and development dependencies
        run: EXTRAS=all bash ../../docker/install-dependencies.sh --with lint,test,codespell https://download.pytorch.org/whl/cpu
      - name: Run the upstream Ruff, mypy and spelling checks
        run: |
          .venv/bin/ruff check . ../../scripts/ci
          .venv/bin/mypy ./infinity_emb
          .venv/bin/codespell --toml pyproject.toml
      - name: Generate the local model fixture
        run: python ../../scripts/ci/generate-model.py --output "$RUNNER_TEMP/ci-model"
      - name: Run upstream CPU tests and real offline model/API comparisons
        run: |
          source .venv/bin/activate
          python ../../scripts/ci/test-python.py --model-dir "$RUNNER_TEMP/ci-model"
